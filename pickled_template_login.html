<!DOCTYPE html>
<html>
<head>
    <title>PICKLED - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="data:image/png;base64,{{ favicon }}">
    <style>
        :root {
            --primary-light: #0f5350;  /* Verde chiaro */
            --primary-main: #2d8371;   /* Verde medio */
            --primary-dark: #aacf76;   /* Verde scuro */
            --petrol: #02433e;        /* Verde petrolio */
            --accent-color: #ff8a65;
            --light-color: #f1f8e9;
            --dark-color: #263238;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-dark) 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--dark-color);
        }
        
        .login-container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            margin-bottom: 25px;
            color: var(--petrol);
        }
        
        .logo i {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: var(--primary-dark);
        }
        
        .logo h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .logo p {
            font-size: 0.9rem;
            color: #666;
        }
        
        .login-form {
            margin-top: 20px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--petrol);
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            border-color: var(--primary-main);
            box-shadow: 0 0 0 3px rgba(77, 184, 168, 0.2);
            outline: none;
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 70%;
            transform: translateY(-50%);
            color: var(--primary-main);
            height: 1em;
            line-height: 1;
            display: flex;
            align-items: center;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--petrol);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 105, 92, 0.3);
        }
        

        
        .version {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <!-- <i class="fas fa-leaf"></i> -->
            <img src="data:image/png;base64,{{ pickledlogo }}">
            <!-- <h1>PICKLED</h1> -->
            <p>Platform for Instant Config Keep & Lightweight Export Daemon</p>
        </div>
        
        <form method="post" action="/login" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            
            <div class="input-group">
                <label for="username">Username</label>
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="username" name="username" placeholder="Your username goes here" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" name="password" placeholder="Please input your password" required autocomplete="off" readonly onfocus="this.removeAttribute('readonly');">
            </div>
            
            <button type="submit">
                <i class="fas fa-sign-in-alt"></i> Accedi
            </button>
        </form>
        
    </div>
    
    <div class="version">v{{ version }}</div>
</body>
</html>
